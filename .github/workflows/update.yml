name: 혜택 수집

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 예약과 수동 실행이 겹쳐도 한 번에 하나만 돌린다. 진행 중인 실행은 끊지 않고 기다리게 한다
# (끊으면 data/state.json 만 바뀌거나 커밋이 중간에 멈춘다).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 아래 단계별 재시도까지 다 써도 끝나도록 넉넉히. 멈춰 버린 실행이 끝없이 도는 것만 막는다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 조건(PROFILE_JSON)이 없으면 다시 해 봐야 소용없으니 먼저 확인하고 바로 실패시킨다.
      # 값은 비었는지만 보고, 어디에도 출력하지 않는다.
      - name: 조건 비밀값 확인
        id: profile
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          if [ -z "$(printf %s "$PROFILE_JSON" | tr -d '[:space:]')" ] && [ ! -f profile.json ] && [ ! -f config/profile.json ]; then
            echo "::error title=조건을 읽을 수 없어요::비밀값 PROFILE_JSON 이 비어 있어요. 저장소 Settings → Secrets and variables → Actions 에서 등록해 주세요."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        timeout-minutes: 5
        run: |
          source .github/scripts/ci-helpers.sh
          retry 3 15 pip install --retries 5 --timeout 60 -r requirements.txt

      # collect.py 는 요청마다 몇 번 다시 해 보지만, API 점검처럼 몇 분 이어지는 오류는 못 넘긴다.
      # 그래서 간격을 길게 두고 통째로 다시 한다.
      - name: 수집
        timeout-minutes: 15
        env:
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          source .github/scripts/ci-helpers.sh
          script=$( [ -f scripts/collect.py ] && echo scripts/collect.py || echo collect.py )
          # 다시 할 때는 앞 시도가 바꿔 둔 data/state.json 등을 되돌린다.
          # 안 그러면 '새 소식' 기록이 이미 소비돼서 텔레그램 알림이 빠진다.
          collect() { git checkout -- . && python "$script"; }
          retry 3 60 collect

      - name: 결과 저장
        id: save
        run: |
          source .github/scripts/ci-helpers.sh
          git config user.name "benefit-bot"
          git config user.email "benefit-bot@users.noreply.github.com"
          # 휴대폰에서 실수로 profile.json 을 다시 올려도 공개 상태로 남지 않게 내린다.
          git rm -q --cached --ignore-unmatch profile.json config/profile.json
          git add -A
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않아요"
            exit 0
          fi
          git commit -m "혜택 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          push_with_rebase "${GITHUB_REF_NAME}"

      # 어느 단계에서든 실패하면 기존 텔레그램으로 알린다. 조건·로그 내용은 담지 않고
      # 사유 한 줄과 실행 기록 주소만 보낸다. (GitHub 기본 실패 메일도 따로 간다.)
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_OUTCOME: ${{ steps.profile.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::텔레그램 비밀값이 없어 실패 알림은 보내지 못했어요 (GitHub 실패 메일만 갑니다)"
            exit 0
          fi
          if [ "$PROFILE_OUTCOME" = "failure" ]; then
            reason="조건 비밀값 PROFILE_JSON 이 비어 있어요. 저장소 Settings → Secrets 에서 등록해 주세요."
          else
            reason="수집이나 저장이 여러 번 다시 해도 실패했어요."
          fi
          text=$(printf '⚠️ 혜택 레이더 실패\n%s\n%s' "$reason" "$RUN_URL")
          curl -sS --fail --max-time 20 --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "::warning::텔레그램 실패 알림을 보내지 못했어요 (GitHub 실패 메일만 갑니다)"
